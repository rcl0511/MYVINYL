<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="b" cx="32%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#9F5FFF"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <radialGradient id="c" cx="28%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Record body -->
  <circle cx="16" cy="16" r="16" fill="url(#a)"/>
  <!-- Groove rings -->
  <circle cx="16" cy="16" r="14.8" fill="none" stroke="#232323" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="13.2" fill="none" stroke="#1e1e1e" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="11.6" fill="none" stroke="#232323" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#1e1e1e" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="8.4" fill="none" stroke="#232323" stroke-width="0.8"/>
  <!-- Purple label -->
  <circle cx="16" cy="16" r="6.8" fill="url(#b)"/>
  <!-- Label shine -->
  <circle cx="16" cy="16" r="6.8" fill="url(#c)"/>
  <!-- Center spindle hole -->
  <circle cx="16" cy="16" r="1.6" fill="#060606"/>
